<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Escolar · Mi billetera</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="pickBox" class="wrap" style="max-width:480px;padding-top:60px;">
    <div class="landing" style="min-height:auto;padding:0 0 24px;">
      <div class="coin">👛</div>
      <h1>¿Quién eres?</h1>
      <p>Toca tu nombre para ver tu billetera.</p>
    </div>
    <div class="panel">
      <div class="student-list" id="pickList"></div>
    </div>
    <p style="text-align:center;"><a href="index.html" style="color:var(--ink-soft);font-size:.85rem;">← Volver</a></p>
  </div>

  <div id="walletBox" class="wrap hidden">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Mi billetera</div>
      <a class="exit" href="student.html" id="switchUser">Cambiar usuario</a>
    </div>

    <div class="wallet-hero">
      <div class="label">Saldo disponible</div>
      <div class="amount" id="walletAmount">$0</div>
      <div class="who" id="walletName"></div>
    </div>

    <div class="panel">
      <h2>La tienda</h2>
      <div class="item-grid" id="storeGrid"></div>
      <p class="empty" id="storeEmpty" style="display:none;">La tienda aún no tiene artículos.</p>
    </div>

    <div class="panel">
      <h2>Historial de movimientos</h2>
      <div class="history" id="historyBox"></div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
